
name: Portfolio GitHub - Statistiques et catalogue

on:
  workflow_dispatch:

  schedule:
    # Synchronisation toutes les 6 heures (UTC)
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ibn1306-profile-stats
  cancel-in-progress: false

jobs:
  update-portfolio:
    name: Actualiser le portfolio GitHub

    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot du profil
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualiser les statistiques et projets
        env:
          GITHUB_USERNAME: Ibn-1306
          PROFILE_METADATA_TOKEN: ${{ secrets.PROFILE_METADATA_TOKEN }}
        run: |
          python scripts/update_profile.py

      - name: Verifier les modifications
        run: |
          git diff --check

      - name: Publier le README actualise
        run: |
          if git diff --quiet -- README.md; then
            echo "Portfolio deja a jour."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git commit \
            -m "docs: actualiser automatiquement le portfolio"

          git push origin "HEAD:${GITHUB_REF_NAME}"
