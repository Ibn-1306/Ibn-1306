
name: Portfolio GitHub - Statistiques et catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ibn1306-profile-stats
  cancel-in-progress: false

jobs:
  update-portfolio:
    name: Actualiser le portfolio GitHub
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot du profil
        uses: actions/checkout@v7

      - name: Configurer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Synchroniser et publier le portfolio
        env:
          GITHUB_USERNAME: Ibn-1306
          PROFILE_METADATA_TOKEN: ${{ secrets.PROFILE_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Tentative ${attempt}/3"
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD

            python scripts/update_profile.py
            git diff --check

            if git diff --quiet -- README.md; then
              echo "Portfolio deja a jour."
              exit 0
            fi

            git add README.md
            git commit -m "docs: actualiser automatiquement le portfolio"

            if git push origin HEAD:main; then
              echo "Publication reussie."
              exit 0
            fi

            echo "La branche distante a change."
            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "::error::Echec apres 3 tentatives."
          exit 1
